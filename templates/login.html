{% extends "base.html" %}
{% block title %}Sign In — P2P Cloud{% endblock %}
{% block content %}
<style>
  .auth-wrap {
    min-height: calc(100vh - 58px);
    display: flex; align-items: center; justify-content: center;
    padding: 2rem; position: relative; z-index: 1;
  }
  .auth-card {
    width: 100%; max-width: 420px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 2.5rem;
    position: relative; overflow: hidden;
    animation: fadeIn 0.4s ease;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .auth-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
  }
  /* Scanning line animation */
  .auth-card::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(56,189,248,0.5), transparent);
    animation: scanLine 4s ease-in-out infinite;
  }
  @keyframes scanLine { 0%{top:2px;opacity:1} 90%{top:100%;opacity:0.3} 100%{top:2px;opacity:0} }

  .auth-icon { text-align: center; margin-bottom: 1.5rem; }
  .auth-icon svg { width: 48px; height: 48px; }
  .auth-title {
    font-family: 'JetBrains Mono', monospace; font-size: 1rem; font-weight: 700;
    color: var(--accent); text-align: center; margin-bottom: 0.3rem; letter-spacing: 0.06em;
  }
  .auth-sub {
    font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
    color: var(--text2); text-align: center; margin-bottom: 2rem;
  }
  .auth-link {
    text-align: center; margin-top: 1.25rem;
    font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--text2);
  }
  .auth-link a { color: var(--accent); text-decoration: none; }
  .auth-link a:hover { text-decoration: underline; }
</style>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-icon">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="16" r="8" stroke="#38bdf8" stroke-width="1.5"/>
        <path d="M8 40c0-8.837 7.163-16 16-16s16 7.163 16 16" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="24" cy="16" r="4" fill="rgba(56,189,248,0.2)" stroke="#818cf8" stroke-width="1"/>
      </svg>
    </div>
    <div class="auth-title">PEER AUTHENTICATION</div>
    <div class="auth-sub">// sign in to join the P2P network</div>

    <div id="alert" class="alert"></div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-solid btn-full" style="margin-top:0.5rem" onclick="doLogin()" id="loginBtn">
      SIGN IN
    </button>
    <div class="auth-link">No account? <a href="/register">Create one</a></div>
  </div>
</div>

<script>
function doLogin() {
  var u = document.getElementById('username').value.trim();
  var p = document.getElementById('password').value;
  var btn = document.getElementById('loginBtn');
  if (!u || !p) { showAlert('alert-error','All fields required.'); return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Authenticating...';
  fetch('/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username:u, password:p})
  }).then(function(r){return r.json();}).then(function(d){
    if (d.success) { showAlert('alert-success','Login successful — joining network...'); setTimeout(function(){window.location='/peer';},800); }
    else { showAlert('alert-error', d.message); btn.disabled=false; btn.innerHTML='SIGN IN'; }
  }).catch(function(){ showAlert('alert-error','Connection error.'); btn.disabled=false; btn.innerHTML='SIGN IN'; });
}
function showAlert(cls,msg){var el=document.getElementById('alert');el.className='alert '+cls+' show';el.textContent=msg;}
</script>
{% endblock %}
