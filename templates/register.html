{% extends "base.html" %}
{% block title %}Register — P2P Cloud{% endblock %}
{% block content %}
<style>
  .auth-wrap {
    min-height: calc(100vh - 58px);
    display: flex; align-items: center; justify-content: center;
    padding: 2rem; position: relative; z-index: 1;
  }
  .auth-card {
    width: 100%; max-width: 420px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 2.5rem;
    position: relative; overflow: hidden;
    animation: fadeIn 0.4s ease;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .auth-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--green), var(--accent));
  }
  .auth-card::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(52,211,153,0.5), transparent);
    animation: scanLine 4s ease-in-out infinite;
  }
  @keyframes scanLine { 0%{top:2px;opacity:1} 90%{top:100%;opacity:0.3} 100%{top:2px;opacity:0} }
  .auth-title { font-family:'JetBrains Mono',monospace; font-size:1rem; font-weight:700; color:var(--green); text-align:center; margin-bottom:0.3rem; letter-spacing:0.06em; }
  .auth-sub   { font-family:'JetBrains Mono',monospace; font-size:0.62rem; color:var(--text2); text-align:center; margin-bottom:2rem; }
  .auth-link  { text-align:center; margin-top:1.25rem; font-family:'JetBrains Mono',monospace; font-size:0.65rem; color:var(--text2); }
  .auth-link a { color:var(--accent); text-decoration:none; }
  .anon-reveal {
    background: rgba(52,211,153,0.06); border: 1px solid rgba(52,211,153,0.2);
    border-radius: 8px; padding: 0.85rem 1rem; margin-top: 1rem; display: none;
    font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
  }
  .anon-reveal.show { display: block; animation: fadeIn 0.4s ease; }
  .anon-label { color: var(--text2); margin-bottom: 4px; }
  .anon-id    { color: var(--green); word-break: break-all; font-size: 0.6rem; }
</style>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-title">CREATE PEER ACCOUNT</div>
    <div class="auth-sub">// register and receive your anonymous identity</div>

    <div id="alert" class="alert"></div>

    <div class="form-group">
      <label>Username (3–32 chars, letters/digits/_)</label>
      <input type="text" id="username" placeholder="Choose a username">
    </div>
    <div class="form-group">
      <label>Password (min 8 characters)</label>
      <input type="password" id="password" placeholder="Choose a password"
             onkeydown="if(event.key==='Enter')doRegister()">
    </div>
    <button class="btn btn-green btn-full" style="margin-top:0.5rem" onclick="doRegister()" id="regBtn">
      REGISTER &amp; GET ANONYMOUS ID
    </button>

    <div class="anon-reveal" id="anonReveal">
      <div class="anon-label">// Step 3: Anonymous ID assigned</div>
      <div class="anon-id" id="anonId"></div>
    </div>

    <div class="auth-link">Already registered? <a href="/login">Sign in</a></div>
  </div>
</div>

<script>
function doRegister() {
  var u = document.getElementById('username').value.trim();
  var p = document.getElementById('password').value;
  var btn = document.getElementById('regBtn');
  if (!u || !p) { showAlert('alert-error','All fields required.'); return; }
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Registering...';
  fetch('/register', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username:u, password:p})
  }).then(function(r){return r.json();}).then(function(d){
    if (d.success) {
      showAlert('alert-success','Account created! Redirecting...');
      if (d.anonymous_id) { document.getElementById('anonId').textContent = d.anonymous_id; document.getElementById('anonReveal').classList.add('show'); }
      setTimeout(function(){window.location='/login';},1800);
    } else { showAlert('alert-error',d.message); btn.disabled=false; btn.innerHTML='REGISTER &amp; GET ANONYMOUS ID'; }
  }).catch(function(){ showAlert('alert-error','Connection error.'); btn.disabled=false; btn.innerHTML='REGISTER &amp; GET ANONYMOUS ID'; });
}
function showAlert(cls,msg){var el=document.getElementById('alert');el.className='alert '+cls+' show';el.textContent=msg;}
</script>
{% endblock %}
